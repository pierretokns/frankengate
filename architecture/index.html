  text-decoration: none;

  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;

h1,
h2,
h3,
h4,
h5,
h6,
p {

h4,
h5,

b,
strong,

  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;

  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);

  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;

}

  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);

  white-space: normal;
  pointer-events: none;
  user-select: none;

.viz-grid {

  flex-direction: column;
  gap: 2px;

.viz-stat-value {

  flex-wrap: wrap;

.sr-only {

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;

  padding: 0 8px;

  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {

.btn:not(:disabled):hover {

  height: 14px;

  background-color: var(--secondary);

  height: 20px;

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;fg-architecture&quot;&gt;
  &lt;style&gt;
    #fg-architecture { color: var(--foreground); font-size: var(--font-size-base); }
    #fg-architecture .controls { margin-bottom: 14px; }
    #fg-architecture .legend { display:flex; flex-wrap:wrap; gap:8px 14px; margin:10px 0 16px; color:var(--muted-foreground); }
    #fg-architecture .legend span { display:inline-flex; align-items:center; gap:5px; }
    #fg-architecture .swatch { width:13px; height:13px; display:inline-block; background:color-mix(in srgb,var(--viz-series-1) 18%,transparent); border:1px solid color-mix(in srgb,var(--viz-series-1) 55%,var(--border)); }
    #fg-architecture .swatch.async { background:color-mix(in srgb,var(--viz-series-2) 18%,transparent); border-color:color-mix(in srgb,var(--viz-series-2) 55%,var(--border)); }
    #fg-architecture .swatch.external { background:color-mix(in srgb,var(--viz-series-3) 18%,transparent); border-color:color-mix(in srgb,var(--viz-series-3) 55%,var(--border)); }
    #fg-architecture .zone { margin:0 0 18px; }
    #fg-architecture .zone-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:0 0 8px; border-bottom:1px solid var(--border); padding-bottom:5px; }
    #fg-architecture .zone-head h3 { margin:0; }
    #fg-architecture .zone-head span { color:var(--muted-foreground); }
    #fg-architecture .flow { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:18px; align-items:stretch; }
    #fg-architecture .node { position:relative; min-width:0; padding:11px 10px 10px; border:1px solid var(--border); background:var(--card); color:var(--card-foreground); }
    #fg-architecture .node.hot { background:color-mix(in srgb,var(--viz-series-1) 10%,var(--card)); border-color:color-mix(in srgb,var(--viz-series-1) 45%,var(--border)); }
    #fg-architecture .node.async { background:color-mix(in srgb,var(--viz-series-2) 10%,var(--card)); border-color:color-mix(in srgb,var(--viz-series-2) 45%,var(--border)); }
    #fg-architecture .node.external { background:color-mix(in srgb,var(--viz-series-3) 10%,var(--card)); border-color:color-mix(in srgb,var(--viz-series-3) 45%,var(--border)); }
    #fg-architecture .node::after { content:&quot;→&quot;; position:absolute; right:-15px; top:50%; transform:translateY(-50%); color:var(--muted-foreground); }
    #fg-architecture .node:last-child::after, #fg-architecture .no-arrow::after { display:none; }
    #fg-architecture .node h4 { margin:0 44px 5px 0; font-weight:500; }
    #fg-architecture .node p { margin:0 0 5px; color:var(--muted-foreground); }
    #fg-architecture .node .api { margin-top:7px; color:var(--foreground); }
    #fg-architecture .badges { position:absolute; right:6px; top:6px; display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
    #fg-architecture .origin { display:inline-flex; min-width:29px; justify-content:center; padding:1px 4px; border:1px solid var(--border); background:var(--background); color:var(--foreground); font-size:11px; font-weight:500; }
    #fg-architecture .concerns { display:flex; flex-wrap:wrap; gap:4px; margin-top:7px; }
    #fg-architecture .concern { padding:1px 4px; background:var(--muted); color:var(--muted-foreground); font-size:11px; }
    #fg-architecture .aws { display:flex; flex-wrap:wrap; gap:4px; margin-top:7px; }
    #fg-architecture .aws span { padding:1px 4px; border:1px solid var(--border); font-size:11px; }
    #fg-architecture .branch { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
    #fg-architecture .branch .node::after { display:none; }
    #fg-architecture .boundary { margin:8px 0 10px; padding:5px 8px; border-top:1px dashed var(--border); border-bottom:1px dashed var(--border); color:var(--muted-foreground); text-align:center; }
    #fg-architecture .detail { margin-top:12px; min-height:22px; color:var(--muted-foreground); }
    #fg-architecture[data-view=&quot;hot&quot;] .node:not(.hot), #fg-architecture[data-view=&quot;async&quot;] .node:not(.async), #fg-architecture[data-view=&quot;external&quot;] .node:not(.external) { opacity:.18; }
    #fg-architecture[data-concerns=&quot;off&quot;] .concerns { display:none; }
    #fg-architecture .node:focus-within { outline:2px solid var(--ring); outline-offset:2px; }
    @media (max-width:700px) {
      #fg-architecture .flow, #fg-architecture .branch { grid-template-columns:1fr; }
      #fg-architecture .node::after { content:&quot;↓&quot;; right:50%; top:auto; bottom:-19px; transform:translateX(50%); }
      #fg-architecture .branch .node::after { display:none; }
      #fg-architecture .zone-head { align-items:flex-start; flex-direction:column; gap:2px; }
    }
  &lt;/style&gt;

  &lt;div class=&quot;viz-controls controls&quot; aria-label=&quot;Architecture view controls&quot;&gt;
    &lt;button class=&quot;btn btn-primary&quot; type=&quot;button&quot; data-view=&quot;all&quot; aria-pressed=&quot;true&quot;&gt;Whole system&lt;/button&gt;
    &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-view=&quot;hot&quot; aria-pressed=&quot;false&quot;&gt;Hot inference path&lt;/button&gt;
    &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-view=&quot;async&quot; aria-pressed=&quot;false&quot;&gt;Async control &amp;amp; evidence&lt;/button&gt;
    &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-view=&quot;external&quot; aria-pressed=&quot;false&quot;&gt;External tools &amp;amp; providers&lt;/button&gt;
    &lt;label class=&quot;form-check form-switch&quot;&gt;&lt;input class=&quot;form-check-input&quot; id=&quot;fg-concerns&quot; type=&quot;checkbox&quot; checked&gt;&lt;span class=&quot;form-check-label&quot;&gt;Security &amp;amp; privacy&lt;/span&gt;&lt;/label&gt;
  &lt;/div&gt;

  &lt;div class=&quot;legend text-small&quot; aria-label=&quot;Legend&quot;&gt;
    &lt;span&gt;&lt;i class=&quot;swatch&quot;&gt;&lt;/i&gt; synchronous hot path&lt;/span&gt;
    &lt;span&gt;&lt;i class=&quot;swatch async&quot;&gt;&lt;/i&gt; asynchronous / control plane&lt;/span&gt;
    &lt;span&gt;&lt;i class=&quot;swatch external&quot;&gt;&lt;/i&gt; outside FrankenGate trust boundary&lt;/span&gt;
    &lt;span&gt;🆕 net-new FrankenGate feature&lt;/span&gt;&lt;span&gt;🛡️ security concern&lt;/span&gt;&lt;span&gt;🔒 privacy concern&lt;/span&gt;
    &lt;span&gt;&lt;b&gt;BF&lt;/b&gt; Bifrost&lt;/span&gt;&lt;span&gt;&lt;b&gt;FG&lt;/b&gt; FrankenGate&lt;/span&gt;&lt;span&gt;&lt;b&gt;FS&lt;/b&gt; Frankensearch&lt;/span&gt;&lt;span&gt;&lt;b&gt;EE&lt;/b&gt; Eidetic&lt;/span&gt;&lt;span&gt;&lt;b&gt;FP&lt;/b&gt; Franken family&lt;/span&gt;
  &lt;/div&gt;

  &lt;section class=&quot;zone&quot;&gt;
    &lt;div class=&quot;zone-head&quot;&gt;&lt;h3&gt;1 · Request and inference data plane&lt;/h3&gt;&lt;span&gt;Latency-critical; analytics failure must not affect it&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;flow&quot;&gt;
      &lt;article class=&quot;node external hot&quot; data-detail=&quot;SDKs, Claude Code, customer apps and MCP clients enter through one public origin.&quot;&gt;
        &lt;div class=&quot;badges&quot;&gt;&lt;span class=&quot;origin&quot;&gt;EXT&lt;/span&gt;&lt;/div&gt;&lt;h4&gt;Clients &amp;amp; agents&lt;/h4&gt;&lt;p&gt;OpenAI/Anthropic/Bedrock SDKs · Claude Code · MCP&lt;/p&gt;&lt;div class=&quot;api&quot;&gt;&lt;code&gt;HTTPS · SSE · WebSocket · MCP&lt;/code&gt;&lt;/div&gt;
        &lt;div class=&quot;concerns&quot;&gt;&lt;span class=&quot;concern&quot;&gt;🛡️ untrusted input&lt;/span&gt;&lt;span class=&quot;concern&quot;&gt;🔒 prompts/files&lt;/span&gt;&lt;/div&gt;
      &lt;/article&gt;
      &lt;article class=&quot;node hot&quot; data-detail=&quot;One origin keeps browser auth uniform while routing static, admin, analytics and inference traffic to separate backends.&quot;&gt;
        &lt;div class=&quot;badges&quot;&gt;&lt;span class=&quot;origin&quot;&gt;FG&lt;/span&gt;&lt;/div&gt;&lt;h4&gt;🆕 Edge / ingress / BFF&lt;/h4&gt;&lt;p&gt;TLS · WAF policy · session boundary · route split&lt;/p&gt;&lt;div class=&quot;aws&quot;&gt;&lt;span&gt;AWS ALB&lt;/span&gt;&lt;span&gt;AWS WAF&lt;/span&gt;&lt;span&gt;ACM&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;concerns&quot;&gt;&lt;span class=&quot;concern&quot;&gt;🛡️ header spoofing&lt;/span&gt;&lt;span class=&quot;concern&quot;&gt;🔒 access logs&lt;/span&gt;&lt;/div&gt;
      &lt;/article&gt;
      &lt;article class=&quot;node hot&quot; data-detail=&quot;The Go gateway remains the only synchronous inference engine: auth, policy, quota reservation, routing, providers, streaming and minimal evidence emission.&quot;&gt;
        &lt;div class=&quot;badges&quot;&gt;&lt;span class=&quot;origin&quot;&gt;BF&lt;/span&gt;&lt;span class=&quot;origin&quot;&gt;FG&lt;/span&gt;&lt;/div&gt;&lt;h4&gt;Go inference gateway&lt;/h4&gt;&lt;p&gt;AuthN/Z · governance · quota · routing · plugins · MCP · streaming&lt;/p&gt;&lt;div class=&quot;api&quot;&gt;&lt;code&gt;/v1/* · provider-native APIs&lt;/code&gt;&lt;/div&gt;&lt;div class=&quot;aws&quot;&gt;&lt;span&gt;EKS&lt;/span&gt;&lt;span&gt;ECR&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;concerns&quot;&gt;&lt;span class=&quot;concern&quot;&gt;🛡️ deny-by-default&lt;/span&gt;&lt;span class=&quot;concern&quot;&gt;🔒 no raw log blocking&lt;/span&gt;&lt;/div&gt;
      &lt;/article&gt;
      &lt;article class=&quot;node hot external&quot; data-detail=&quot;Provider selection can target Bedrock inference profiles or external model APIs. Retries/fallbacks stay inside the same entitlement and reservation decision.&quot;&gt;
        &lt;div class=&quot;badges&quot;&gt;&lt;span class=&quot;origin&quot;&gt;BF&lt;/span&gt;&lt;/div&gt;&lt;h4&gt;Provider adapters&lt;/h4&gt;&lt;p&gt;Bedrock · OpenAI · Anthropic · Gemini · 20+ providers&lt;/p&gt;&lt;div class=&quot;api&quot;&gt;&lt;code&gt;HTTPS / SigV4 / SSE&lt;/code&gt;&lt;/div&gt;&lt;div class=&quot;aws&quot;&gt;&lt;span&gt;Bedrock&lt;/span&gt;&lt;span&gt;STS&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;concerns&quot;&gt;&lt;span class=&quot;concern&quot;&gt;🛡️ egress/region&lt;/span&gt;&lt;span class=&quot;concern&quot;&gt;🔒 provider retention&lt;/span&gt;&lt;/div&gt;
      &lt;/article&gt;
      &lt;article class=&quot;node hot external no-arrow&quot; data-detail=&quot;Models and MCP tools are external side effects. Tool access is intersected at global, client, tool and request scopes.&quot;&gt;
        &lt;div class=&quot;badges&quot;&gt;&lt;span class=&quot;origin&quot;&gt;EXT&lt;/span&gt;&lt;span class=&quot;origin&quot;&gt;BF&lt;/span&gt;&lt;/div&gt;&lt;h4&gt;Models &amp;amp; MCP tools&lt;/h4&gt;&lt;p&gt;Inference · embeddings · tool execution&lt;/p&gt;&lt;div class=&quot;concerns&quot;&gt;&lt;span class=&quot;concern&quot;&gt;🛡️ prompt injection&lt;/span&gt;&lt;span class=&quot;concern&quot;&gt;🔒 data disclosure&lt;/span&gt;&lt;/div&gt;
      &lt;/article&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;div class=&quot;boundary&quot;&gt;Hard availability boundary · gateway emits bounded metadata/events; it never runs evals, reports, training, OCR, ASR or index builds&lt;/div&gt;

  &lt;section class=&quot;zone&quot;&gt;
    &lt;div class=&quot;zone-head&quot;&gt;&lt;h3&gt;2 · Durable authority and propagation&lt;/h3&gt;&lt;span&gt;One authority per datum; caches and indexes are rebuildable&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;flow&quot;&gt;
      &lt;article class=&quot;node async&quot; data-detail=&quot;Identity is federated from Okta/OIDC and SCIM, but authorization remains a FrankenGate policy decision.&quot;&gt;
        &lt;div class=&quot;badges&quot;&gt;&lt;span class=&quot;origin&quot;&gt;FG&lt;/span&gt;&lt;/div&gt;&lt;h4&gt;🆕 Identity &amp;amp; directory&lt;/h4&gt;&lt;p&gt;OIDC PKCE · Okta · SCIM · groups · access profiles&lt;/p&gt;&lt;div class=&quot;api&quot;&gt;&lt;code&gt;OIDC · SCIM 2.0&lt;/code&gt;&lt;/div&gt;
        &lt;div class=&quot;concerns&quot;&gt;&lt;span class=&quot;concern&quot;&gt;🛡️ token/JWKS&lt;/span&gt;&lt;span class=&quot;concern&quot;&gt;🔒 directory attributes&lt;/span&gt;&lt;/div&gt;
      &lt;/article&gt;
      &lt;article class=&quot;node async&quot; data-detail=&quot;Aurora PostgreSQL is canonical for policies, keys, quota reservations, audit metadata, trace manifests, runs, evals, jobs and retrieval ACLs.&quot;&gt;
        &lt;div class=&quot;badges&quot;&gt;&lt;span class=&quot;origin&quot;&gt;BF&lt;/span&gt;&lt;span class=&quot;origin&quot;&gt;FG&lt;/span&gt;&lt;/div&gt;&lt;h4&gt;Aurora PostgreSQL authority&lt;/h4&gt;&lt;p&gt;RLS · policy epochs · reservations · outbox · leases · pgvector/FTS&lt;/p&gt;&lt;div class=&quot;aws&quot;&gt;&lt;span&gt;Aurora PostgreSQL&lt;/span&gt;&lt;span&gt;RDS Proxy optional&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;concerns&quot;&gt;&lt;span class=&quot;concern&quot;&gt;🛡️ role/pool isolation&lt;/span&gt;&lt;span class=&quot;concern&quot;&gt;🔒 row/chunk ACL&lt;/span&gt;&lt;/div&gt;
      &lt;/article&gt;
      &lt;article class=&quot;node async&quot; data-detail=&quot;Same-transaction outbox plus LISTEN/NOTIFY and polling repair distributes monotonic revisions without adding a mandatory queue or Redis service.&quot;&gt;
        &lt;div class=&quot;badges&quot;&gt;&lt;span class=&quot;origin&quot;&gt;FG&lt;/span&gt;&lt;/div&gt;&lt;h4&gt;🆕 Outbox &amp;amp; snapshot publisher&lt;/h4&gt;&lt;p&gt;&lt;code&gt;LISTEN/NOTIFY&lt;/code&gt; fast wakeup · polling repair · signed snapshots&lt;/p&gt;
        &lt;div class=&quot;concerns&quot;&gt;&lt;span class=&quot;concern&quot;&gt;🛡️ stale-policy fail closed&lt;/span&gt;&lt;/div&gt;
      &lt;/article&gt;
      &lt;article class=&quot;node async&quot; data-detail=&quot;Gateway pods consume immutable versioned policy snapshots. They do not synchronously query analytics systems.&quot;&gt;
        &lt;div class=&quot;badges&quot;&gt;&lt;span class=&quot;origin&quot;&gt;BF&lt;/span&gt;&lt;span class=&quot;origin&quot;&gt;FG&lt;/span&gt;&lt;/div&gt;&lt;h4&gt;Per-pod immutable cache&lt;/h4&gt;&lt;p&gt;Atomic swap · checksum · freshness lease · bounded staleness&lt;/p&gt;&lt;div class=&quot;concerns&quot;&gt;&lt;span class=&quot;concern&quot;&gt;🛡️ revocation SLO&lt;/span&gt;&lt;/div&gt;
      &lt;/article&gt;
      &lt;article class=&quot;node async no-arrow&quot; data-detail=&quot;Large objects stay out of PostgreSQL. Content-addressed manifests, KMS encryption and short-lived signed URLs preserve provenance.&quot;&gt;
        &lt;div class=&quot;badges&quot;&gt;&lt;span class=&quot;origin&quot;&gt;FG&lt;/span&gt;&lt;/div&gt;&lt;h4&gt;🆕 Artifact store&lt;/h4&gt;&lt;p&gt;Datasets · reports · model/checkpoint files · screenshots · bundles&lt;/p&gt;&lt;div class=&quot;aws&quot;&gt;&lt;span&gt;S3&lt;/span&gt;&lt;span&gt;KMS&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;concerns&quot;&gt;&lt;span class=&quot;concern&quot;&gt;🛡️ signed URL scope&lt;/span&gt;&lt;span class=&quot;concern&quot;&gt;🔒 retention/deletion&lt;/span&gt;&lt;/div&gt;
      &lt;/article&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;zone&quot;&gt;
    &lt;div class=&quot;zone-head&quot;&gt;&lt;h3&gt;3 · Product control plane and dashboard&lt;/h3&gt;&lt;span&gt;Same browser origin; independently scalable deployments&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;flow&quot;&gt;
      &lt;article class=&quot;node external async&quot; data-detail=&quot;Admins and individual users see only capability-backed routes and their authorized tenants, traces, runs, reports and skills.&quot;&gt;
        &lt;div class=&quot;badges&quot;&gt;&lt;span class=&quot;origin&quot;&gt;EXT&lt;/span&gt;&lt;/div&gt;&lt;h4&gt;Browser / operator CLI&lt;/h4&gt;&lt;p&gt;Admin · self-service traces · runs · evals · reports · skill mining&lt;/p&gt;&lt;div class=&quot;concerns&quot;&gt;&lt;span class=&quot;concern&quot;&gt;🛡️ CSRF/session&lt;/span&gt;&lt;span class=&quot;concern&quot;&gt;🔒 individual surveillance&lt;/span&gt;&lt;/div&gt;
      &lt;/article&gt;
      &lt;article class=&quot;node async&quot; data-detail=&quot;The React/Vite dashboard is separately deployed but remains visually and authentically one product through the edge.&quot;&gt;
        &lt;div class=&quot;badges&quot;&gt;&lt;span class=&quot;origin&quot;&gt;BF&lt;/span&gt;&lt;span class=&quot;origin&quot;&gt;FG&lt;/span&gt;&lt;/div&gt;&lt;h4&gt;Dashboard SPA&lt;/h4&gt;&lt;p&gt;Capability manifest · governance · observability · analytics workbench&lt;/p&gt;&lt;div class=&quot;api&quot;&gt;&lt;code&gt;static assets + typed clients&lt;/code&gt;&lt;/div&gt;&lt;div class=&quot;aws&quot;&gt;&lt;span&gt;S3/CloudFront optional&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;concerns&quot;&gt;&lt;span class=&quot;concern&quot;&gt;🛡️ honest feature gating&lt;/span&gt;&lt;span class=&quot;concern&quot;&gt;🔒 safe aggregates&lt;/span&gt;&lt;/div&gt;
      &lt;/article&gt;
      &lt;article class=&quot;node async&quot; data-detail=&quot;Existing administrative endpoints stay in Go during staged extraction: providers, keys, governance, routing, MCP and config.&quot;&gt;
        &lt;div class=&quot;badges&quot;&gt;&lt;span class=&quot;origin&quot;&gt;BF&lt;/span&gt;&lt;span class=&quot;origin&quot;&gt;FG&lt;/span&gt;&lt;/div&gt;&lt;h4&gt;Go admin APIs&lt;/h4&gt;&lt;p&gt;Providers · keys · governance · routing · MCP · config&lt;/p&gt;&lt;div class=&quot;api&quot;&gt;&lt;code&gt;/api/*&lt;/code&gt;&lt;/div&gt;
        &lt;div class=&quot;concerns&quot;&gt;&lt;span class=&quot;concern&quot;&gt;🛡️ admin RBAC&lt;/span&gt;&lt;/div&gt;
      &lt;/article&gt;
      &lt;article class=&quot;node async&quot; data-detail=&quot;The new Rust API owns experiments, runs, evals, lineage, retrieval, reports and job admission. It returns handles for unbounded work.&quot;&gt;
        &lt;div class=&quot;badges&quot;&gt;&lt;span class=&quot;origin&quot;&gt;FG&lt;/span&gt;&lt;/div&gt;&lt;h4&gt;🆕 Rust analytics control API&lt;/h4&gt;&lt;p&gt;Experiments · runs · evals · lineage · reports · jobs · search&lt;/p&gt;&lt;div class=&quot;api&quot;&gt;&lt;code&gt;/api/analytics/* · OpenAPI&lt;/code&gt;&lt;/div&gt;&lt;div class=&quot;aws&quot;&gt;&lt;span&gt;EKS&lt;/span&gt;&lt;span&gt;ECR&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;concerns&quot;&gt;&lt;span class=&quot;concern&quot;&gt;🛡️ reauthorize every call&lt;/span&gt;&lt;span class=&quot;concern&quot;&gt;🔒 purpose binding&lt;/span&gt;&lt;/div&gt;
      &lt;/article&gt;
      &lt;article class=&quot;node async no-arrow&quot; data-detail=&quot;PostgreSQL leases and workload queues preserve one minimal operations model. Each worker class scales on its own demand signal.&quot;&gt;
        &lt;div class=&quot;badges&quot;&gt;&lt;span class=&quot;origin&quot;&gt;FG&lt;/span&gt;&lt;/div&gt;&lt;h4&gt;🆕 Job admission &amp;amp; leases&lt;/h4&gt;&lt;p&gt;Idempotency · heartbeat · checkpoint · cancel · drain · typed outcomes&lt;/p&gt;&lt;div class=&quot;concerns&quot;&gt;&lt;span class=&quot;concern&quot;&gt;🛡️ no detached work&lt;/span&gt;&lt;/div&gt;
      &lt;/article&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;zone&quot;&gt;
    &lt;div class=&quot;zone-head&quot;&gt;&lt;h3&gt;4 · Independently scaled analytics and enrichment workers&lt;/h3&gt;&lt;span&gt;One job protocol; distinct CPU/GPU/quota/privacy profiles&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;branch&quot;&gt;
      &lt;article class=&quot;node async&quot; data-detail=&quot;Replay and deterministic evaluation consume frozen revisions and never borrow gateway provider quotas or pods.&quot;&gt;
        &lt;div class=&quot;badges&quot;&gt;&lt;span class=&quot;origin&quot;&gt;FG&lt;/span&gt;&lt;span class=&quot;origin&quot;&gt;BF&lt;/span&gt;&lt;/div&gt;&lt;h4&gt;🆕 Replay &amp;amp; eval workers&lt;/h4&gt;&lt;p&gt;Deterministic replay · rules · LLM judges · promotion evidence&lt;/p&gt;&lt;div class=&quot;aws&quot;&gt;&lt;span&gt;EKS Jobs&lt;/span&gt;&lt;span&gt;Bedrock optional&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;concerns&quot;&gt;&lt;span class=&quot;concern&quot;&gt;🛡️ budget admission&lt;/span&gt;&lt;span class=&quot;concern&quot;&gt;🔒 evaluator leakage&lt;/span&gt;&lt;/div&gt;
      &lt;/article&gt;
      &lt;article class=&quot;node async&quot; data-detail=&quot;Versioned embedding jobs write rebuildable derived indexes. Query serving is separate from index construction.&quot;&gt;
        &lt;div class=&quot;badges&quot;&gt;&lt;span class=&quot;origin&quot;&gt;FG&lt;/span&gt;&lt;span class=&quot;origin&quot;&gt;HF&lt;/span&gt;&lt;/div&gt;&lt;h4&gt;🆕 Embedding &amp;amp; index builders&lt;/h4&gt;&lt;p&gt;Model revisions · dual-write/backfill · checkpoint · atomic promotion&lt;/p&gt;&lt;div class=&quot;aws&quot;&gt;&lt;span&gt;EKS CPU/GPU&lt;/span&gt;&lt;span&gt;S3&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;concerns&quot;&gt;&lt;span class=&quot;concern&quot;&gt;🛡️ model provenance&lt;/span&gt;&lt;span class=&quot;concern&quot;&gt;🔒 eligible text only&lt;/span&gt;&lt;/div&gt;
      &lt;/article&gt;
      &lt;article class=&quot;node async&quot; data-detail=&quot;Polars is the default analytical dataframe engine. FrankenNetworkX and FrankenMarkdown/Mermaid are optional upstream workers for graph and rendering needs.&quot;&gt;
        &lt;div class=&quot;badges&quot;&gt;&lt;span class=&quot;origin&quot;&gt;FG&lt;/span&gt;&lt;span class=&quot;origin&quot;&gt;PL&lt;/span&gt;&lt;span class=&quot;origin&quot;&gt;FP&lt;/span&gt;&lt;/div&gt;&lt;h4&gt;🆕 Reports &amp;amp; skill mining&lt;/h4&gt;&lt;p&gt;Polars · graph analysis · Markdown/PDF · skill-loop metrics&lt;/p&gt;&lt;div class=&quot;aws&quot;&gt;&lt;span&gt;EKS&lt;/span&gt;&lt;span&gt;Aurora read role&lt;/span&gt;&lt;span&gt;S3&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;concerns&quot;&gt;&lt;span class=&quot;concern&quot;&gt;🛡️ statement limits&lt;/span&gt;&lt;span class=&quot;concern&quot;&gt;🔒 employee inference&lt;/span&gt;&lt;/div&gt;
      &lt;/article&gt;
      &lt;article class=&quot;node async external&quot; data-detail=&quot;Arbitrary scorers and training remain in pinned sandboxed Python/GPU images. MLflow, Phoenix, Hugging Face and NVIDIA are adapters, not authorities.&quot;&gt;
        &lt;div class=&quot;badges&quot;&gt;&lt;span class=&quot;origin&quot;&gt;FG&lt;/span&gt;&lt;span class=&quot;origin&quot;&gt;ML&lt;/span&gt;&lt;span class=&quot;origin&quot;&gt;HF&lt;/span&gt;&lt;span class=&quot;origin&quot;&gt;NV&lt;/span&gt;&lt;/div&gt;&lt;h4&gt;🆕 Sandboxed training/scorers&lt;/h4&gt;&lt;p&gt;Python · CUDA · MLflow/Phoenix I/O · HF models · NVIDIA workflows&lt;/p&gt;&lt;div class=&quot;aws&quot;&gt;&lt;span&gt;EKS GPU / AWS Batch optional&lt;/span&gt;&lt;span&gt;S3&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;concerns&quot;&gt;&lt;span class=&quot;concern&quot;&gt;🛡️ signed image/egress&lt;/span&gt;&lt;span class=&quot;concern&quot;&gt;🔒 training corpus&lt;/span&gt;&lt;/div&gt;
      &lt;/article&gt;
      &lt;article class=&quot;node async&quot; data-detail=&quot;Media and document enrichment are optional worker deployments, never gateway plugins.&quot;&gt;
        &lt;div class=&quot;badges&quot;&gt;&lt;span class=&quot;origin&quot;&gt;FG&lt;/span&gt;&lt;span class=&quot;origin&quot;&gt;FOCR&lt;/span&gt;&lt;span class=&quot;origin&quot;&gt;FW&lt;/span&gt;&lt;/div&gt;&lt;h4&gt;🆕 OCR / ASR enrichment&lt;/h4&gt;&lt;p&gt;FrankenOCR · FrankenWhisper · redaction/classification gates&lt;/p&gt;&lt;div class=&quot;aws&quot;&gt;&lt;span&gt;EKS CPU/GPU&lt;/span&gt;&lt;span&gt;S3&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;concerns&quot;&gt;&lt;span class=&quot;concern&quot;&gt;🛡️ model supply chain&lt;/span&gt;&lt;span class=&quot;concern&quot;&gt;🔒 raw media&lt;/span&gt;&lt;/div&gt;
      &lt;/article&gt;
      &lt;article class=&quot;node async external&quot; data-detail=&quot;Snowflake export and other customer integrations are asynchronous adapters with separate credentials, egress and audit boundaries.&quot;&gt;
        &lt;div class=&quot;badges&quot;&gt;&lt;span class=&quot;origin&quot;&gt;FG&lt;/span&gt;&lt;span class=&quot;origin&quot;&gt;FSNOW&lt;/span&gt;&lt;/div&gt;&lt;h4&gt;🆕 Export adapters&lt;/h4&gt;&lt;p&gt;Snowflake · MLflow · customer object stores · signed bundles&lt;/p&gt;&lt;div class=&quot;aws&quot;&gt;&lt;span&gt;Secrets Manager&lt;/span&gt;&lt;span&gt;KMS&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;concerns&quot;&gt;&lt;span class=&quot;concern&quot;&gt;🛡️ scoped credentials&lt;/span&gt;&lt;span class=&quot;concern&quot;&gt;🔒 export approval&lt;/span&gt;&lt;/div&gt;
      &lt;/article&gt;
      &lt;article class=&quot;node async external&quot; data-detail=&quot;Frankensearch is tested through the smallest tenant-aware adapter. PostgreSQL remains source of truth and fallback.&quot;&gt;
        &lt;div class=&quot;badges&quot;&gt;&lt;span class=&quot;origin&quot;&gt;FG&lt;/span&gt;&lt;span class=&quot;origin&quot;&gt;FS&lt;/span&gt;&lt;/div&gt;&lt;h4&gt;🆕 Optional search service&lt;/h4&gt;&lt;p&gt;Frankensearch BM25/vector/rerank · authorized progressive results&lt;/p&gt;&lt;div class=&quot;api&quot;&gt;&lt;code&gt;versioned retrieval API&lt;/code&gt;&lt;/div&gt;&lt;div class=&quot;aws&quot;&gt;&lt;span&gt;EKS&lt;/span&gt;&lt;span&gt;EBS/S3 snapshots&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;concerns&quot;&gt;&lt;span class=&quot;concern&quot;&gt;🛡️ ACL before candidates&lt;/span&gt;&lt;span class=&quot;concern&quot;&gt;🔒 snippets/cache&lt;/span&gt;&lt;/div&gt;
      &lt;/article&gt;
      &lt;article class=&quot;node async external&quot; data-detail=&quot;Redis is not a launch dependency. Add ElastiCache only if measured Aurora contention justifies a non-authoritative accelerator.&quot;&gt;
        &lt;div class=&quot;badges&quot;&gt;&lt;span class=&quot;origin&quot;&gt;FG&lt;/span&gt;&lt;span class=&quot;origin&quot;&gt;FP&lt;/span&gt;&lt;/div&gt;&lt;h4&gt;Optional accelerators&lt;/h4&gt;&lt;p&gt;Redis/FrankenRedis · never policy/evidence authority&lt;/p&gt;&lt;div class=&quot;aws&quot;&gt;&lt;span&gt;ElastiCache optional&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;concerns&quot;&gt;&lt;span class=&quot;concern&quot;&gt;🛡️ tenant key isolation&lt;/span&gt;&lt;/div&gt;
      &lt;/article&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;zone&quot;&gt;
    &lt;div class=&quot;zone-head&quot;&gt;&lt;h3&gt;5 · Endpoint-local and development ecosystem&lt;/h3&gt;&lt;span&gt;Outside product Helm and customer runtime boundary&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;branch&quot;&gt;
      &lt;article class=&quot;node external&quot; data-detail=&quot;Local collectors detect agent installations, keep encrypted local spools and require explicit review before upload.&quot;&gt;
        &lt;div class=&quot;badges&quot;&gt;&lt;span class=&quot;origin&quot;&gt;FG&lt;/span&gt;&lt;span class=&quot;origin&quot;&gt;FAD&lt;/span&gt;&lt;/div&gt;&lt;h4&gt;🆕 Endpoint collector&lt;/h4&gt;&lt;p&gt;franken-agent-detection · adapters · encrypted SQLite/files · device auth&lt;/p&gt;&lt;div class=&quot;api&quot;&gt;&lt;code&gt;OAuth device flow · batch upload&lt;/code&gt;&lt;/div&gt;&lt;div class=&quot;concerns&quot;&gt;&lt;span class=&quot;concern&quot;&gt;🛡️ device binding&lt;/span&gt;&lt;span class=&quot;concern&quot;&gt;🔒 consent/redaction&lt;/span&gt;&lt;/div&gt;
      &lt;/article&gt;
      &lt;article class=&quot;node external&quot; data-detail=&quot;CASS, Eidetic and MetaSkill remain local-first tools. They can emit governed evidence but never become the managed tenant authority.&quot;&gt;
        &lt;div class=&quot;badges&quot;&gt;&lt;span class=&quot;origin&quot;&gt;CASS&lt;/span&gt;&lt;span class=&quot;origin&quot;&gt;EE&lt;/span&gt;&lt;span class=&quot;origin&quot;&gt;MS&lt;/span&gt;&lt;/div&gt;&lt;h4&gt;Local recall &amp;amp; skill tools&lt;/h4&gt;&lt;p&gt;Session search · personal memory · skill validation/promotion&lt;/p&gt;&lt;div class=&quot;concerns&quot;&gt;&lt;span class=&quot;concern&quot;&gt;🛡️ prompt injection&lt;/span&gt;&lt;span class=&quot;concern&quot;&gt;🔒 raw sessions local&lt;/span&gt;&lt;/div&gt;
      &lt;/article&gt;
      &lt;article class=&quot;node external&quot; data-detail=&quot;NTM, FrankenTerm, Agent Mail, Beads/BV and CI safety tools accelerate development only; none are production dependencies.&quot;&gt;
        &lt;div class=&quot;badges&quot;&gt;&lt;span class=&quot;origin&quot;&gt;NTM&lt;/span&gt;&lt;span class=&quot;origin&quot;&gt;FT&lt;/span&gt;&lt;span class=&quot;origin&quot;&gt;BR&lt;/span&gt;&lt;/div&gt;&lt;h4&gt;Agentic development flywheel&lt;/h4&gt;&lt;p&gt;NTM · FrankenTerm · Agent Mail · Beads/BV · DCG/UBS · RCH&lt;/p&gt;&lt;div class=&quot;concerns&quot;&gt;&lt;span class=&quot;concern&quot;&gt;🛡️ dev credentials&lt;/span&gt;&lt;span class=&quot;concern&quot;&gt;🔒 session artifacts&lt;/span&gt;&lt;/div&gt;
      &lt;/article&gt;
      &lt;article class=&quot;node external&quot; data-detail=&quot;AWS operational services surround deployments but are not application authorities.&quot;&gt;
        &lt;div class=&quot;badges&quot;&gt;&lt;span class=&quot;origin&quot;&gt;AWS&lt;/span&gt;&lt;span class=&quot;origin&quot;&gt;FG&lt;/span&gt;&lt;/div&gt;&lt;h4&gt;Operations &amp;amp; supply chain&lt;/h4&gt;&lt;p&gt;Images · secrets · telemetry · autoscaling · audit · backup&lt;/p&gt;&lt;div class=&quot;aws&quot;&gt;&lt;span&gt;ECR&lt;/span&gt;&lt;span&gt;Secrets Manager&lt;/span&gt;&lt;span&gt;KMS&lt;/span&gt;&lt;span&gt;CloudWatch/OTel&lt;/span&gt;&lt;span&gt;CloudTrail&lt;/span&gt;&lt;span&gt;AWS Backup&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;concerns&quot;&gt;&lt;span class=&quot;concern&quot;&gt;🛡️ IAM least privilege&lt;/span&gt;&lt;span class=&quot;concern&quot;&gt;🔒 telemetry content off&lt;/span&gt;&lt;/div&gt;
      &lt;/article&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;div class=&quot;detail text-small&quot; id=&quot;fg-detail&quot; aria-live=&quot;polite&quot;&gt;Select a component to inspect its architectural role.&lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;fg-architecture&#x27;);
      const detail = document.getElementById(&#x27;fg-detail&#x27;);
      const buttons = Array.from(root.querySelectorAll(&#x27;[data-view]&#x27;));
      buttons.forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        root.dataset.view = button.dataset.view;
        buttons.forEach((peer) =&gt; {
          const active = peer === button;
          peer.setAttribute(&#x27;aria-pressed&#x27;, String(active));
          peer.classList.toggle(&#x27;btn-primary&#x27;, active);
        });
        detail.textContent = button.dataset.view === &#x27;all&#x27; ? &#x27;Whole-system view: hot inference, asynchronous control/evidence, and external integrations.&#x27; : button.textContent.trim() + &#x27; highlighted; other components remain visible as context.&#x27;;
      }));
      root.querySelector(&#x27;#fg-concerns&#x27;).addEventListener(&#x27;change&#x27;, (event) =&gt; {
        root.dataset.concerns = event.target.checked ? &#x27;on&#x27; : &#x27;off&#x27;;
      });
      root.querySelectorAll(&#x27;.node&#x27;).forEach((node) =&gt; {
        node.addEventListener(&#x27;click&#x27;, () =&gt; { detail.textContent = node.dataset.detail; });
      });
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
