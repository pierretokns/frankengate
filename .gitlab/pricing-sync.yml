# Include this file from the FrankenGate GitLab project and create a daily
# pipeline schedule. The job only publishes after validation succeeds.
pricing-sync:
  image: golang:1.26
  stage: maintenance
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: manual
  script:
    # Mintlify publishes the docs/ directory as the site root. Keep the
    # generated cache in that same tree so the browser loader and the
    # deployment artifact address the identical path.
    - go run ./scripts/pricing-sync -url "${BIFROST_PRICING_URL:-https://getbifrost.ai/datasheet}" -out docs/data/pricing
  artifacts:
    name: frankengate-pricing-$CI_COMMIT_SHA
    expire_in: 1 year
    paths:
      - docs/data/pricing/latest.json
      - docs/data/pricing/latest-upstream.json
      - docs/data/pricing/archive/
  # A publishing step (Pages, object storage, or the site's deploy job) should
  # consume latest.json; this job deliberately does not commit generated data.
