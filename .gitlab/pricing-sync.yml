# Include this file from the FrankenGate GitLab project and create a daily
# pipeline schedule. The job only publishes after validation succeeds. The
# generated files live under docs/ so the normal branded site deployment can
# publish them at /data/pricing/.
pricing-sync:
  image: golang:1.26
  stage: maintenance
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: manual
  script:
    # Keep this tool independently runnable: the repository's developer
    # go.work is intentionally ignored and does not exist in every runner.
    - cd scripts/pricing-sync
    # Explicitly disable any parent checkout go.work. Without this, Go walks
    # up from the independent module and rejects ./... because the workspace
    # does not include scripts/pricing-sync.
    - GOWORK=off go test ./...
    - GOWORK=off go run . -url "${FRANKENGATE_PRICING_URL:-${BIFROST_PRICING_URL:-https://getbifrost.ai/datasheet}}" -out ../../docs/data/pricing
  artifacts:
    name: frankengate-pricing-$CI_COMMIT_SHA
    expire_in: 1 year
    paths:
      - docs/data/pricing/latest.json
      - docs/data/pricing/latest-upstream.json
      - docs/data/pricing/archive/
  # The normal docs/Pages deployment consumes these files. Keeping the
  # validated snapshot as an artifact also gives us a last-known-good cache
  # when the upstream datasheet is unavailable on a later run.
