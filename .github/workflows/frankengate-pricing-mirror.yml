name: FrankenGate pricing mirror

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      source_url:
        description: Approved public pricing source
        required: false
        default: https://getbifrost.ai/datasheet
        type: string

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_URL: ${{ inputs.source_url || vars.FRANKENGATE_PRICING_URL || 'https://getbifrost.ai/datasheet' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false

      - name: Validate and publish pricing snapshot
        working-directory: scripts/pricing-sync
        run: |
          set -euo pipefail
          GOWORK=off CGO_ENABLED=0 go test ./...
          GOWORK=off CGO_ENABLED=0 go run . -url "$SOURCE_URL" -out ../../docs/data/pricing

      - name: Commit changed snapshot
        run: |
          set -euo pipefail
          git config user.name "frankengate-pricing[bot]"
          git config user.email "frankengate-pricing[bot]@users.noreply.github.com"
          git add docs/data/pricing
          if git diff --cached --quiet; then
            echo "Pricing snapshot unchanged"
            exit 0
          fi
          git commit -m "chore(pricing): refresh model catalog snapshot"
          git push

      - name: Publish snapshot to GitHub Pages
        run: |
          set -euo pipefail
          # Keep dev/docs/data/pricing as the canonical source while copying
          # the validated public files to the branch served by Pages.
          git fetch origin gh-pages
          git worktree add --detach "$RUNNER_TEMP/frankengate-gh-pages" origin/gh-pages
          trap 'git worktree remove --force "$RUNNER_TEMP/frankengate-gh-pages"' EXIT
          mkdir -p "$RUNNER_TEMP/frankengate-gh-pages/pricing"
          cp -R docs/data/pricing/. "$RUNNER_TEMP/frankengate-gh-pages/pricing/"
          cd "$RUNNER_TEMP/frankengate-gh-pages"
          git config user.name "frankengate-pricing[bot]"
          git config user.email "frankengate-pricing[bot]@users.noreply.github.com"
          git add pricing
          if git diff --cached --quiet; then
            echo "Pages pricing snapshot unchanged"
            exit 0
          fi
          git commit -m "chore(pricing): publish Pages snapshot"
          git push origin HEAD:gh-pages
