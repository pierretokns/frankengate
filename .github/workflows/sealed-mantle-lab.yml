name: Sealed Mantle Codex Lab

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: sealed-mantle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codex-gpt55:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: 1.26.5
          cache: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true
              insecure = true
      - name: Run sealed source-built GPT-5.5 lab
        id: lab
        shell: bash
        run: bash .github/scripts/run-sealed-mantle-lab.sh
      - name: Preserve bounded evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sealed-mantle-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/sealed-mantle/
          if-no-files-found: error
          retention-days: 7
      - name: Defensive teardown
        if: always()
        shell: bash
        env:
          LAB_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          BIFROST_IMAGE: registry.invalid/cleanup@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          CODEX_RUNNER_IMAGE: registry.invalid/cleanup@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          CLAUDE_RUNNER_IMAGE: registry.invalid/cleanup@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          EGRESS_SENTINEL_IMAGE: registry.invalid/cleanup@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          bridge_prefix="fg$(printf '%s' "$LAB_RUN_ID" | sha256sum | cut -c1-12)"
          export LAB_CLIENT_BRIDGE="${bridge_prefix}c" LAB_CONTROL_BRIDGE="${bridge_prefix}o" LAB_DATA_BRIDGE="${bridge_prefix}d"
          docker compose --project-name "fg-lab-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --file tests/conformance/lab/compose.yaml --profile clients \
            down --volumes --remove-orphans --timeout 10 || true
          docker rm --force sealed-lab-registry >/dev/null 2>&1 || true
