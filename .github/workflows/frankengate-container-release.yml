name: FrankenGate Container Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable FrankenGate release tag to publish
        required: true
        type: string
      existing_digest:
        description: Existing manifest digest to verify and attest without rebuilding
        required: false
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: Existing immutable FrankenGate release tag to publish
        required: true
        type: string
      existing_digest:
        description: Existing manifest digest to verify and attest without rebuilding
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish and attest multi-architecture image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Validate release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "release_tag must be a vMAJOR.MINOR.PATCH tag" >&2; exit 2 ;;
          esac
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Checkout immutable release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      - name: Install release builder from workflow revision
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin "$WORKFLOW_SHA"
          git show "$WORKFLOW_SHA:transports/Dockerfile.release" > transports/Dockerfile.release

      - name: Derive image metadata
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          {
            echo "image=$image"
            echo "version=${RELEASE_TAG#v}"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "workflow_sha=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push release image
        id: build
        if: inputs.existing_digest == ''
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: transports/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ inputs.release_tag }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.source_sha }}
            org.opencontainers.image.version=${{ inputs.release_tag }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=frankengate-release
          cache-to: type=gha,mode=max,scope=frankengate-release
          provenance: false
          sbom: false

      - name: Resolve immutable image digest
        id: image
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTING_DIGEST: ${{ inputs.existing_digest }}
          IMAGE: ${{ steps.meta.outputs.image }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          digest=${EXISTING_DIGEST:-$BUILT_DIGEST}
          case "$digest" in
            sha256:[0-9a-f][0-9a-f]*) ;;
            *) echo "invalid or missing image digest: $digest" >&2; exit 2 ;;
          esac
          tagged_digest=$(docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')
          test "$tagged_digest" = "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify manifest platforms
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" > manifest.txt
          grep -q 'linux/amd64' manifest.txt
          grep -q 'linux/arm64' manifest.txt

      - name: Verify anonymous public pull metadata
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          repository=${IMAGE#ghcr.io/}
          token=$(curl --fail --silent --show-error "https://ghcr.io/token?scope=repository:${repository}:pull" | jq -er .token)
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/${repository}/manifests/${RELEASE_TAG}" \
            > anonymous-manifest.json
          jq -e '[.manifests[].platform | (.os + "/" + .architecture)] | contains(["linux/amd64", "linux/arm64"])' anonymous-manifest.json

      - name: Verify each platform reports the release version
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            output=$(docker run --rm --platform "$platform" --entrypoint /app/main "$IMAGE@$DIGEST" -version)
            echo "$output"
            echo "$output" | grep -F "$RELEASE_TAG"
            docker image rm "$IMAGE@$DIGEST" >/dev/null 2>&1 || true
          done

      - name: Verify license and modification notice are in every platform image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "$platform" --entrypoint /bin/sh "$IMAGE@$DIGEST" -ec '
              test -r /licenses/LICENSE
              test -r /licenses/NOTICE
              grep -F "Apache License" /licenses/LICENSE >/dev/null
              grep -F "derived from Bifrost AI Gateway" /licenses/NOTICE >/dev/null
              grep -F "affiliated with or endorsed by Maxim AI" /licenses/NOTICE >/dev/null
            '
            docker image rm "$IMAGE@$DIGEST" >/dev/null 2>&1 || true
          done

      - name: Verify image startup and health
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          container=$(docker run -d --platform linux/amd64 -p 18080:8080 "$IMAGE@$DIGEST")
          trap 'docker logs "$container"; docker rm -f "$container"' EXIT
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: ${{ steps.meta.outputs.image }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: frankengate-${{ inputs.release_tag }}-container.spdx.json
          upload-artifact: false

      - name: Record immutable image digest
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          WORKFLOW_SHA: ${{ steps.meta.outputs.workflow_sha }}
        run: |
          {
            echo "image=$IMAGE@$DIGEST"
            echo "source_sha=$SOURCE_SHA"
            echo "workflow_sha=$WORKFLOW_SHA"
          } > "frankengate-${RELEASE_TAG}-container-digest.txt"

      - name: Verify existing image build provenance before repair
        if: inputs.existing_digest != ''
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          gh attestation verify "oci://$IMAGE@$DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://slsa.dev/provenance/v1 \
            --deny-self-hosted-runners

      - name: Attest build provenance
        if: inputs.existing_digest == ''
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3.0.0
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: frankengate-${{ inputs.release_tag }}-container.spdx.json
          push-to-registry: true

      - name: Attach container evidence to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "frankengate-${RELEASE_TAG}-container.spdx.json" \
            "frankengate-${RELEASE_TAG}-container-digest.txt" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

  kubernetes-vk-coherence:
    name: Prove release image across three Kubernetes nodes
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Checkout immutable release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      - name: Install pinned k3d
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/k3d-io/k3d/releases/download/v5.8.3/k3d-linux-amd64 \
            --output /tmp/k3d
          echo 'dbaa79a76ace7f4ca230a1ff41dc7d8a5036a8ad0309e9c54f9bf3836dbe853e  /tmp/k3d' | sha256sum --check
          sudo install -m 0555 /tmp/k3d /usr/local/bin/k3d

      - name: Create three-worker k3s cluster
        run: k3d cluster create frankengate-release --agents 3 --wait --timeout 180s

      - name: Run immutable-image virtual-key coherence oracle
        env:
          FRANKENGATE_IMAGE: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
        run: tests/kubernetes/local-aurora/run-vk-coherence.sh

      - name: Collect failure evidence
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n frankengate-test get events --sort-by=.lastTimestamp || true
          kubectl -n frankengate-test logs -l app.kubernetes.io/name=frankengate-vk --all-containers --tail=200 || true

      - name: Delete test cluster
        if: always()
        run: k3d cluster delete frankengate-release
