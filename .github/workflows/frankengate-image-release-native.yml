name: FrankenGate Native Image Release (Manual)

on:
  # This workflow is deliberately not part of the binary release dependency
  # graph. Invoke it explicitly when a GHCR image is desired.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to publish or repair
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: Existing GitHub release tag produced by frankengate-release
        required: true
        type: string
    outputs:
      digest:
        description: Immutable multi-architecture image digest
        value: ${{ jobs.manifest.outputs.digest }}

env:
  RELEASE_TAG: ${{ inputs.release_tag }}

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }} image
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Checkout immutable release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push native image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: transports/Dockerfile.release
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.release_tag }}-${{ matrix.arch }}
          build-args: VERSION=${{ inputs.release_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.release_tag }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=frankengate-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=frankengate-${{ matrix.arch }}
          provenance: false
          sbom: false

  manifest:
    name: Assemble and verify multi-architecture image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Validate release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Assemble immutable manifest
        id: manifest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE:$RELEASE_TAG" \
            "$IMAGE:$RELEASE_TAG-amd64" \
            "$IMAGE:$RELEASE_TAG-arm64"
          digest="$(docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE@$digest" > manifest.txt
          grep -q 'linux/amd64' manifest.txt
          grep -q 'linux/arm64' manifest.txt

      - name: Verify anonymous manifest pull
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          repository="${IMAGE#ghcr.io/}"
          token="$(curl --fail --silent --show-error "https://ghcr.io/token?scope=repository:${repository}:pull" | jq -er .token)"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/${repository}/manifests/${RELEASE_TAG}" > anonymous-manifest.json
          jq -e '[.manifests[].platform | (.os + "/" + .architecture)] | contains(["linux/amd64", "linux/arm64"])' anonymous-manifest.json

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.manifest.outputs.digest }}
          format: spdx-json
          output-file: frankengate-${{ inputs.release_tag }}-container.spdx.json
          upload-artifact: false

      - name: Record digest evidence
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          source_sha="$(git rev-parse HEAD 2>/dev/null || printf 'release-tag-%s' "$RELEASE_TAG")"
          {
            echo "image=ghcr.io/${repo}@${DIGEST}"
            echo "source_sha=${source_sha}"
            echo "workflow_sha=$GITHUB_SHA"
          } > "frankengate-${RELEASE_TAG}-container-digest.txt"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3.0.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: frankengate-${{ inputs.release_tag }}-container.spdx.json
          push-to-registry: true

      - name: Attach image evidence to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "frankengate-${RELEASE_TAG}-container.spdx.json" \
            "frankengate-${RELEASE_TAG}-container-digest.txt" \
            --clobber --repo "$GITHUB_REPOSITORY"
