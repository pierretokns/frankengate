name: Fork CI

on:
  push:
    branches: ["**"]
    tags-ignore:
      - "*"
  pull_request:
  schedule:
    # Keep vulnerability intelligence fresh without making every code-only
    # push pay for a full govulncheck run.
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GO_VERSION: "1.26.5"
  # Keep compiler/package fan-out bounded on the shared GitHub runner. The
  # wrapper also limits module-level concurrency; this controls Go's internal
  # build graph fan-out inside each module.
  GOFLAGS: "-p=2"

jobs:
  go-checks:
    name: Go checks (no provider secrets)
    # The dev branch has a dedicated, faster beta gate. Keep this full lane
    # for pull requests, other branches, schedules, and explicit dispatches.
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/dev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
      GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
      # The main fork gate validates modules that can ship in FrankenGate
      # artifacts. Example/test fixture modules have dedicated jobs and make
      # this gate needlessly expensive and opaque.
      FORK_RELEASE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Restore Go build and module caches
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            .cache/go-build
            .cache/go-mod
          key: fork-go-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('go.work', 'go.work.sum', '**/go.mod', '**/go.sum') }}
          restore-keys: |
            fork-go-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: Verify runner toolchain before workspace checks
        run: |
          set -euo pipefail
          echo "runner=$(uname -a)"
          timeout 60s go version
          timeout 60s go env GOVERSION GOROOT GOPATH GOMODCACHE GOCACHE
          echo "fork-go-checks preflight complete"

      - name: Run unit tests and vet
        run: |
          set -euo pipefail
          heartbeat() {
            while sleep 30; do
              echo "[$(date -u +%FT%TZ)] fork-go-checks heartbeat"
            done
          }
          heartbeat &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT
          timeout --foreground --signal=TERM --kill-after=30s 25m \
            .github/workflows/scripts/fork-go-checks.sh test-vet

  go-security:
    name: Go vulnerability checks
    # Avoid duplicating the beta push lane; weekly schedule and dependency
    # changes on PRs/other branches still exercise this check.
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/dev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
      GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Detect dependency changes
        id: deps
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Scheduled/manual runs are explicit full security refreshes. For a
          # push/PR, only dependency or scanner changes need a fresh scan; the
          # weekly schedule above still catches newly published advisories.
          if [[ "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA"...HEAD -- \
              '**/go.mod' '**/go.sum' 'go.work' 'go.work.sum' \
              '.github/workflows/scripts/fork-go-checks.sh' | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.deps.outputs.changed == 'true'
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Restore Go module cache for vulnerability scan
        if: steps.deps.outputs.changed == 'true'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .cache/go-mod
          key: fork-go-mod-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('go.work', 'go.work.sum', '**/go.mod', '**/go.sum') }}
          restore-keys: |
            fork-go-mod-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: Derive vulnerability cache epoch
        id: vuln-week
        if: steps.deps.outputs.changed == 'true'
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore dependency vulnerability result
        id: vuln-cache
        if: steps.deps.outputs.changed == 'true'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .cache/vulncheck
          key: govuln-${{ env.GO_VERSION }}-${{ steps.vuln-week.outputs.week }}-${{ hashFiles('**/go.mod', '**/go.sum', '.github/workflows/scripts/fork-go-checks.sh') }}

      - name: Run govulncheck when dependencies or scanner epoch changed
        if: steps.deps.outputs.changed == 'true' && steps.vuln-cache.outputs.cache-hit != 'true'
        run: .github/workflows/scripts/fork-go-checks.sh vuln

      - name: Record vulnerability result for cache
        if: steps.deps.outputs.changed == 'true' && steps.vuln-cache.outputs.cache-hit != 'true'
        run: mkdir -p .cache/vulncheck && printf '%s\n' "govulncheck ${{ env.GO_VERSION }} ${{ steps.vuln-week.outputs.week }}" > .cache/vulncheck/passed

  provenance-hook:
    name: Provenance hook
    if: ${{ false }} # deferred P10 provenance lane
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Detect provenance hook
        id: provenance
        run: |
          if [ -f scripts/verify-provenance.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run provenance self-test
        if: steps.provenance.outputs.present == 'true'
        run: bash scripts/verify-provenance.sh --self-test

      - name: Run provenance gate
        if: steps.provenance.outputs.present == 'true'
        run: bash scripts/verify-provenance.sh

      - name: Missing provenance hook
        if: steps.provenance.outputs.present != 'true'
        run: |
          echo "Required scripts/verify-provenance.sh hook is missing." >&2
          exit 1
