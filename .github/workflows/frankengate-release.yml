# Modified by the FrankenGate project: public fork release pipeline.
name: FrankenGate Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
      GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.5"
          cache: false

      - name: Verify provenance self-tests
        run: bash scripts/verify-provenance.sh --self-test

      - name: Verify provenance and redistribution policy
        run: bash scripts/verify-provenance.sh

      - name: Run tests, race checks, and vet
        run: .github/workflows/scripts/fork-go-checks.sh test-vet

      - name: Run vulnerability checks
        run: .github/workflows/scripts/fork-go-checks.sh vuln

  build:
    name: Build ${{ matrix.artifact }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: linux-amd64
          - runner: macos-15
            artifact: darwin-arm64
          - runner: macos-15-intel
            artifact: darwin-amd64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: "**/go.sum"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build embedded UI and binary
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          make setup-workspace
          make build LOCAL=1 DYNAMIC=1 VERSION="${VERSION#v}"
          ./tmp/bifrost-http -version

      - name: Package binary and license notices
        env:
          ARTIFACT: ${{ matrix.artifact }}
          VERSION: ${{ github.ref_name }}
        run: |
          package="frankengate-${VERSION}-${ARTIFACT}"
          mkdir -p "dist/${package}"
          cp tmp/bifrost-http "dist/${package}/frankengate"
          cp LICENSE NOTICE "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"

      - name: Upload package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: frankengate-${{ matrix.artifact }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: frankengate-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum ./*.tar.gz > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$REPO" \
            --verify-tag \
            --title "FrankenGate $TAG" \
            --notes "FrankenGate $TAG is a Bifrost-compatible public fork baseline. It includes fork branding, explicit Apache-2.0 provenance, a verified embedded-UI gateway binary, and separated Kubernetes liveness/readiness/startup probes. Enterprise roadmap capabilities remain gated by their published conformance tests and are not claimed complete in this release."

  container:
    name: Publish matching GHCR image
    needs: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/frankengate-container-release.yml
    with:
      release_tag: ${{ github.ref_name }}
