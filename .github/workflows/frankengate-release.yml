# Modified by the FrankenGate project: public fork release pipeline.
name: FrankenGate Release

on:
  push:
    tags:
      - "v*"
  # Allows an immutable-tag release to be retried when a hosted runner stalls
  # without force-moving or recreating the version tag.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable existing v* tag to release
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
      GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
      FORK_RELEASE: "1"
      GOFLAGS: "-p=2"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.5"
          cache: false

      - name: Validate migration compatibility manifest
        run: bash scripts/validate-migration-manifest.sh

      - name: Restore Go build and module caches
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            .cache/go-build
            .cache/go-mod
          key: release-go-${{ runner.os }}-1.26.5-${{ hashFiles('go.work', 'go.work.sum', '**/go.mod', '**/go.sum') }}
          restore-keys: |
            release-go-${{ runner.os }}-1.26.5-

      - name: Verify provenance self-tests
        if: ${{ false }} # deferred P10 provenance lane
        run: bash scripts/verify-provenance.sh --self-test

      - name: Verify provenance and redistribution policy
        if: ${{ false }} # deferred P10 provenance lane
        run: bash scripts/verify-provenance.sh

      - name: Run tests, race checks, and vet
        run: |
          set -euo pipefail
          heartbeat() {
            while sleep 30; do
              echo "[$(date -u +%FT%TZ)] frankengate-release verify heartbeat"
            done
          }
          heartbeat &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT
          timeout --foreground --signal=TERM --kill-after=30s 25m \
            .github/workflows/scripts/fork-go-checks.sh test-vet

      - name: Run vulnerability checks
        run: .github/workflows/scripts/fork-go-checks.sh vuln

  build-ui:
    name: Build embedded UI once
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.11.0"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        run: timeout --foreground --signal=TERM --kill-after=30s 12m make build-ui

      - name: Upload embedded UI
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: frankengate-embedded-ui
          path: transports/bifrost-http/ui
          if-no-files-found: error

  build:
    name: Build ${{ matrix.artifact }}
    needs: [verify, build-ui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: linux-amd64
          - runner: macos-15
            artifact: darwin-arm64
          - runner: macos-15-intel
            artifact: darwin-amd64
    runs-on: ${{ matrix.runner }}
    # A platform runner must not hold the single-release/Helm publication
    # chain forever if the UI build or hosted macOS queue stalls.
    timeout-minutes: 35
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
      GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: "**/go.sum"

      - name: Restore native build Go caches
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            .cache/go-build
            .cache/go-mod
          key: release-build-go-${{ runner.os }}-${{ runner.arch }}-1.26.5-${{ hashFiles('go.work', 'go.work.sum', '**/go.mod', '**/go.sum') }}
          restore-keys: |
            release-build-go-${{ runner.os }}-${{ runner.arch }}-1.26.5-

      - name: Download embedded UI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frankengate-embedded-ui
          path: transports/bifrost-http/ui

      - name: Build embedded UI and binary
        env:
          VERSION: ${{ inputs.release_tag || github.ref_name }}
        run: |
          # GNU timeout is available on Ubuntu but not on hosted macOS. The
          # matrix job itself has a 35-minute hard timeout, so retain the
          # tighter guard where available and use the job timeout as the
          # portable fallback on Darwin.
          if command -v timeout >/dev/null 2>&1; then
            timeout --foreground --signal=TERM --kill-after=30s 20m \
              .github/workflows/scripts/build-release-binary.sh
          else
            .github/workflows/scripts/build-release-binary.sh
          fi

      - name: Stage binary and license notices
        env:
          ARTIFACT: ${{ matrix.artifact }}
          VERSION: ${{ inputs.release_tag || github.ref_name }}
        run: |
          package="frankengate-${VERSION}-${ARTIFACT}"
          mkdir -p "dist/${package}"
          cp tmp/bifrost-http "dist/${package}/frankengate"
          if [[ "${ARTIFACT}" == "linux-amd64" ]]; then
            timeout --foreground --signal=TERM --kill-after=30s 12m \
              cargo build --release --manifest-path analytics-rs/Cargo.toml
            cp analytics-rs/target/release/frankengate-analytics-control \
              "dist/${package}/frankengate-analytics-control"
          fi
          cp LICENSE NOTICE "dist/${package}/"

      - name: Generate release SPDX manifest
        env:
          ARTIFACT: ${{ matrix.artifact }}
          VERSION: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          package="frankengate-${VERSION}-${ARTIFACT}"
          digest="$(sha256sum "dist/${package}/frankengate" | awk '{print $1}')"
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg version "${VERSION#v}" --arg digest "$digest" --arg created "$created" \
            '{spdxVersion:"SPDX-2.3", dataLicense:"CC0-1.0", SPDXID:"SPDXRef-DOCUMENT", name:"FrankenGate release", documentNamespace:("https://frankengate.dev/spdx/" + $version), creationInfo:{creators:["Tool: FrankenGate release workflow"], created:$created}, packages:[{SPDXID:"SPDXRef-Package-FrankenGate", name:"frankengate", versionInfo:$version, downloadLocation:"NOASSERTION", filesAnalyzed:true, checksums:[{algorithm:"SHA256", checksumValue:$digest}], licenseConcluded:"Apache-2.0", licenseDeclared:"Apache-2.0", copyrightText:"NOASSERTION"}]}' \
            > "dist/${package}/frankengate.spdx.json"

      - name: Generate platform binary SPDX SBOM
        if: ${{ false }} # deferred P10 provenance lane
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          file: tmp/bifrost-http
          format: spdx-json
          output-file: dist/frankengate-${{ inputs.release_tag || github.ref_name }}-${{ matrix.artifact }}/frankengate.spdx.json
          upload-artifact: false

      - name: Package binary, legal notices, and SBOM
        env:
          ARTIFACT: ${{ matrix.artifact }}
          VERSION: ${{ inputs.release_tag || github.ref_name }}
        run: |
          package="frankengate-${VERSION}-${ARTIFACT}"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"

      - name: Attest platform package provenance
        if: ${{ false }} # deferred P10 provenance lane
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: dist/frankengate-${{ inputs.release_tag || github.ref_name }}-${{ matrix.artifact }}.tar.gz

      - name: Attest platform package SBOM
        if: ${{ false }} # deferred P10 provenance lane
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3.0.0
        with:
          subject-path: dist/frankengate-${{ inputs.release_tag || github.ref_name }}-${{ matrix.artifact }}.tar.gz
          sbom-path: dist/frankengate-${{ inputs.release_tag || github.ref_name }}-${{ matrix.artifact }}/frankengate.spdx.json

      - name: Upload package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: frankengate-${{ matrix.artifact }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Checkout immutable release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
          persist-credentials: false

      - name: Download packages
        run: mkdir -p dist

      - name: Download platform packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # download-artifact accepts one glob, not a comma-separated list.
          # The previous value matched nothing, leaving the publish workspace
          # without dist/*.tar.gz and failing the checksum step.
          pattern: frankengate-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum ./*.tar.gz > SHA256SUMS

      - name: Inspect every platform package
        run: |
          set -euo pipefail
          inspect="$RUNNER_TEMP/frankengate-release-inspect"
          mkdir -p "$inspect"
          for archive in dist/*.tar.gz; do
            name="$(basename "$archive" .tar.gz)"
            tar -tzf "$archive" > "$inspect/$name.contents"
            for member in frankengate LICENSE NOTICE frankengate.spdx.json; do
              grep -Fx "$name/$member" "$inspect/$name.contents"
            done
            mkdir -p "$inspect/$name"
            tar -xzf "$archive" -C "$inspect/$name"
            test -x "$inspect/$name/$name/frankengate"
            cmp LICENSE "$inspect/$name/$name/LICENSE"
            cmp NOTICE "$inspect/$name/$name/NOTICE"
            jq -e '.spdxVersion == "SPDX-2.3" and (.packages | length > 0)' \
              "$inspect/$name/$name/frankengate.spdx.json" >/dev/null
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$REPO" \
            --verify-tag \
            --title "FrankenGate $TAG" \
            --notes "FrankenGate $TAG is a Bifrost-compatible public fork baseline. It includes fork branding, explicit Apache-2.0 provenance, a verified embedded-UI gateway binary, and separated Kubernetes liveness/readiness/startup probes. Enterprise roadmap capabilities remain gated by their published conformance tests and are not claimed complete in this release."

      - name: Verify published package attestations
        if: ${{ false }} # deferred P10 provenance lane
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for archive in dist/*.tar.gz; do
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --predicate-type https://slsa.dev/provenance/v1 \
              --deny-self-hosted-runners
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --predicate-type https://spdx.dev/Document/v2.3 \
              --deny-self-hosted-runners
          done

  # Container publishing is intentionally decoupled from the binary release.
  # The native image workflow remains available through workflow_dispatch for
  # an explicit, separately approved GHCR build; Docker/Buildx failures must
  # not block binary and Helm artifact delivery.
