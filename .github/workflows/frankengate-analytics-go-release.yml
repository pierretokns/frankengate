name: FrankenGate Analytics Go Beta Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in the analytics beta artifacts
        required: true
        default: 0.1.0-beta.1
        type: string

permissions:
  contents: read

env:
  GO_VERSION: "1.26.5"
  VERSION: ${{ inputs.version }}

jobs:
  verify-and-package:
    name: Verify and package analytics beta
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Run analytics unit, vet, and contract gates
        run: |
          set -euo pipefail
          make analytics-test
          (cd analytics-go && go vet ./...)
          make analytics-check

      - name: Run ClickHouse integration gate
        run: make analytics-integration

      - name: Build cross-platform beta artifacts
        run: make analytics-package-matrix

      - name: Verify aggregate artifact manifest
        run: |
          set -euo pipefail
          (cd dist && shasum -c "frankengate-analytics-${VERSION}-SHA256SUMS")
          test "$(tar -tzf "dist/frankengate-analytics-${VERSION}-linux-amd64.tar.gz" | wc -l | tr -d ' ')" -eq 6

      - name: Upload analytics beta packages
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: frankengate-analytics-go-${{ env.VERSION }}
          path: |
            dist/frankengate-analytics-${{ env.VERSION }}-*.tar.gz
            dist/frankengate-analytics-${{ env.VERSION }}-*.tar.gz.sha256
            dist/frankengate-analytics-${{ env.VERSION }}-SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish analytics beta prerelease
    needs: verify-and-package
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Download verified analytics packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frankengate-analytics-go-${{ env.VERSION }}
          path: dist

      - name: Verify checksums before publication
        run: (cd dist && shasum -c "frankengate-analytics-${VERSION}-SHA256SUMS")

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="analytics-v${VERSION}"
          notes="FrankenGate Analytics beta ${VERSION}.

          This release contains the separately deployed Go trace-native Autoeval binary for authorized, sanitized traces. It is a beta evaluation tool, not an inference-path dependency."
          assets=(
            "dist/frankengate-analytics-${VERSION}-darwin-arm64.tar.gz"
            "dist/frankengate-analytics-${VERSION}-linux-amd64.tar.gz"
            "dist/frankengate-analytics-${VERSION}-linux-arm64.tar.gz"
            "dist/frankengate-analytics-${VERSION}-darwin-arm64.tar.gz.sha256"
            "dist/frankengate-analytics-${VERSION}-linux-amd64.tar.gz.sha256"
            "dist/frankengate-analytics-${VERSION}-linux-arm64.tar.gz.sha256"
            "dist/frankengate-analytics-${VERSION}-SHA256SUMS"
          )
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --repo "$REPO" --clobber
            gh release edit "$tag" --repo "$REPO" --title "FrankenGate Analytics ${VERSION}" --notes "$notes" --prerelease
          else
            gh release create "$tag" "${assets[@]}" --repo "$REPO" --title "FrankenGate Analytics ${VERSION}" --notes "$notes" --prerelease
          fi
