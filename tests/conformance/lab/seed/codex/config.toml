model = "bedrock_mantle/gpt-5.5"
model_provider = "frankengate"
model_catalog_json = "/cell/codex/model-catalog.json"
check_for_update_on_startup = false
web_search = "disabled"

[features]
responses_websockets = false
responses_websockets_v2 = false

[analytics]
enabled = false

[model_providers.frankengate]
name = "FrankenGate sealed lab"
base_url = "http://bifrost-1:8080/openai/v1"
env_key = "OPENAI_API_KEY"
wire_api = "responses"
request_max_retries = 0
stream_max_retries = 0
requires_openai_auth = false
supports_websockets = false
env_http_headers = { "x-sealed-codex-run-id" = "LAB_RUN_ID" }
