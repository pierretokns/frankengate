apiVersion: v1
kind: ConfigMap
metadata:
  name: frankengate-vk-config
  namespace: frankengate-test
  labels:
    app.kubernetes.io/part-of: frankengate
    frankengate.dev/test-only: "true"
data:
  pricing.json: |
    {}
  model-parameters.json: |
    {}
  mcp-library.json: |
    []
  config.json: |
    {
      "config_store": {
        "enabled": true,
        "type": "postgres",
        "config": {
          "host": "postgres.frankengate-test.svc.cluster.local",
          "port": "5432",
          "user": "frankengate",
          "password": "test-only-password",
          "db_name": "frankengate",
          "ssl_mode": "disable"
        }
      },
      "logs_store": {
        "enabled": true,
        "type": "postgres",
        "config": {
          "host": "postgres.frankengate-test.svc.cluster.local",
          "port": "5432",
          "user": "frankengate",
          "password": "test-only-password",
          "db_name": "frankengate",
          "ssl_mode": "disable"
        }
      },
      "framework": {
        "pricing": {
          "pricing_url": "file:///app/catalog/pricing.json",
          "pricing_sync_interval": 86400,
          "model_parameters_url": "file:///app/catalog/model-parameters.json",
          "mcp_library_url": "file:///app/catalog/mcp-library.json"
        }
      },
      "client": {
        "enforce_auth_on_inference": true,
        "enable_logging": false
      },
      "governance": {
        "auth_config": {
          "is_enabled": false,
          "disable_auth_on_inference": false
        },
        "virtual_keys": []
      },
      "plugins": [
        {
          "name": "governance",
          "enabled": true,
          "config": {
            "reservation_max_tokens": 128,
            "reservation_cost_micros_per_token": 1,
            "reservation_allow_overdraft": false
          }
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frankengate-vk
  namespace: frankengate-test
  labels:
    app.kubernetes.io/name: frankengate-vk
    app.kubernetes.io/part-of: frankengate
    frankengate.dev/test-only: "true"
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: frankengate-vk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frankengate-vk
        app.kubernetes.io/part-of: frankengate
        frankengate.dev/test-only: "true"
      annotations:
        # Replaced by run-vk-coherence.sh before the Deployment is created.
        # This makes the tested artifact part of the initial pod template and
        # avoids a second, artificial cold-start rollout.
        frankengate.dev/test-artifact-sha256: "__ARTIFACT_SHA256__"
    spec:
      automountServiceAccountToken: false
      # Co-locate with the disposable PostgreSQL fixture. This keeps the
      # offline harness portable across k3d node names while reusing the
      # runtime image already pulled for postgres-0. The assertion is
      # independent process/pod coherence, not cross-node networking.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: postgres
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: fetch-test-binary
          # Reuse the exact tag already present for postgres-0. k3d's offline
          # containerd cache retains the platform image by tag/image ID rather
          # than by the manifest-list digest used by the StatefulSet spec.
          image: docker.io/library/postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              for attempt in $(seq 1 30); do
                if wget -q -T 2 -O /work/frankengate "http://${BINARY_SERVER_HOST}:18080/frankengate" &&
                  printf '%s  %s\n' "$BINARY_SHA256" /work/frankengate | sha256sum -c - >/dev/null 2>&1; then
                  chmod 0555 /work/frankengate
                  exit 0
                fi
                rm -f /work/frankengate
                sleep 1
              done
              echo "timed out fetching tested binary after 30 attempts" >&2
              exit 1
          env:
            # Replaced by run-vk-coherence.sh after it creates the disposable
            # in-cluster binary service. A raw apply intentionally fails fast.
            - name: BINARY_SERVER_HOST
              value: "__BINARY_SERVICE_IP__"
            - name: BINARY_SHA256
              value: "__ARTIFACT_SHA256__"
          volumeMounts:
            - name: binary
              mountPath: /work
      containers:
        - name: gateway
          image: docker.io/library/postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["/work/frankengate"]
          args: ["-app-dir", "/app/data", "-host", "0.0.0.0", "-port", "8080", "-log-level", "info", "-log-style", "json"]
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            # Ten or more replicas can contend on the disposable Postgres
            # bootstrap lock. Keep the probe fail-closed, but allow the
            # deployment's 240s readiness oracle to observe slow starters.
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: binary
              mountPath: /work
            - name: config
              mountPath: /app/data/config.json
              subPath: config.json
            - name: config
              mountPath: /app/catalog/pricing.json
              subPath: pricing.json
            - name: config
              mountPath: /app/catalog/model-parameters.json
              subPath: model-parameters.json
            - name: config
              mountPath: /app/catalog/mcp-library.json
              subPath: mcp-library.json
            - name: data
              mountPath: /app/data/runtime
      volumes:
        - name: binary
          emptyDir: {}
        - name: config
          configMap:
            name: frankengate-vk-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frankengate-vk
  namespace: frankengate-test
  labels:
    app.kubernetes.io/name: frankengate-vk
    app.kubernetes.io/part-of: frankengate
    frankengate.dev/test-only: "true"
spec:
  selector:
    app.kubernetes.io/name: frankengate-vk
  ports:
    - name: http
      port: 8080
      targetPort: http
