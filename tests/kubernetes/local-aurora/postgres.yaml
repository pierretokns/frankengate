apiVersion: v1
kind: Namespace
metadata:
  name: frankengate-test
  labels:
    app.kubernetes.io/part-of: frankengate
    frankengate.dev/test-only: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-auth
  namespace: frankengate-test
  labels:
    app.kubernetes.io/part-of: frankengate
    frankengate.dev/test-only: "true"
type: Opaque
stringData:
  POSTGRES_DB: frankengate
  POSTGRES_USER: frankengate
  POSTGRES_PASSWORD: test-only-password
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: frankengate-test
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: frankengate
    frankengate.dev/test-only: "true"
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: frankengate-test
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: frankengate
    frankengate.dev/test-only: "true"
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      annotations:
        frankengate.dev/postgres-image-digest: sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: frankengate
        frankengate.dev/test-only: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: postgres-auth
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          frankengate.dev/test-only: "true"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-test-only
  namespace: frankengate-test
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: frankengate-test
      ports:
        - protocol: TCP
          port: 5432
  egress: []
