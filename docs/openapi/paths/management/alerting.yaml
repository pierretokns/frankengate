channels:
  get:
    operationId: listAlertChannels
    summary: List alert channels
    tags: [Alerting]
    security:
      - ManagementBearerAuth: []
      - SessionCookieAuth: []
    responses:
      '200':
        description: Alert channels
        content:
          application/json:
            schema:
              type: object
              required: [channels]
              properties:
                channels:
                  type: array
                  items: { $ref: '../../schemas/management/alerting.yaml#/AlertChannel' }
  post:
    operationId: createAlertChannel
    summary: Create an alert channel
    tags: [Alerting]
    security:
      - ManagementBearerAuth: []
      - SessionCookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../../schemas/management/alerting.yaml#/AlertChannel' }
    responses:
      '200':
        description: Created channel
        content:
          application/json:
            schema: { $ref: '../../schemas/management/alerting.yaml#/AlertChannel' }

channels-by-id:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string }
  put:
    operationId: updateAlertChannel
    summary: Update an alert channel
    tags: [Alerting]
    security:
      - ManagementBearerAuth: []
      - SessionCookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../../schemas/management/alerting.yaml#/AlertChannel' }
    responses:
      '200': { description: Updated channel }
  delete:
    operationId: deleteAlertChannel
    summary: Delete an alert channel
    tags: [Alerting]
    security:
      - ManagementBearerAuth: []
      - SessionCookieAuth: []
    responses:
      '204': { description: Channel deleted }

