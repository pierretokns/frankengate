# Read-only Agent Model Card APIs. Card bodies are visibility-filtered by the
# authenticated management scope; review/quarantine/kill mutations are not
# exposed by this surface.

agent-model-cards:
  get:
    operationId: listAgentModelCards
    summary: List visible Agent Model Cards
    tags:
      - Agent Model Cards
    security:
      - ManagementBearerAuth: []
    parameters:
      - name: provider
        in: query
        schema: { type: string }
      - name: query
        in: query
        schema: { type: string }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 100 }
      - name: offset
        in: query
        schema: { type: integer, minimum: 0 }
    responses:
      '200':
        description: Visible Agent Model Card snapshot
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/agent-model-cards.yaml#/AgentModelCardsListResponse'
      '503':
        description: Model catalog is unavailable
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true

metadata:
  get:
    operationId: getAgentModelCardMetadata
    summary: Get Agent Model Card snapshot metadata
    tags:
      - Agent Model Cards
    security:
      - ManagementBearerAuth: []
    responses:
      '200':
        description: Snapshot metadata without card bodies
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/agent-model-cards.yaml#/AgentModelCardMetadataResponse'
      '503':
        description: Model catalog is unavailable
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true

detail:
  get:
    operationId: getAgentModelCard
    summary: Get one visible Agent Model Card
    tags:
      - Agent Model Cards
    security:
      - ManagementBearerAuth: []
    parameters:
      - name: provider
        in: query
        required: true
        schema: { type: string }
      - name: model
        in: query
        required: true
        schema: { type: string }
    responses:
      '200':
        description: Agent Model Card detail
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/agent-model-cards.yaml#/AgentModelCardDetailResponse'
      '404':
        $ref: '../../openapi.yaml#/components/responses/NotFound'

export:
  get:
    operationId: exportAgentModelCards
    summary: Export the complete visible Agent Model Card snapshot
    tags:
      - Agent Model Cards
    security:
      - ManagementBearerAuth: []
    responses:
      '200':
        description: Downloadable read-only Agent Model Card snapshot
        headers:
          ETag:
            schema: { type: string }
          Content-Disposition:
            schema: { type: string }
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/agent-model-cards.yaml#/AgentModelCardsExportResponse'

validate:
  post:
    operationId: validateAgentModelCard
    summary: Validate an Agent Model Card without persisting it
    tags:
      - Agent Model Cards
    security:
      - ManagementBearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/management/agent-model-cards.yaml#/AgentModelCardInput'
    responses:
      '200':
        description: Validation result with stable reason codes
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/agent-model-cards.yaml#/AgentModelCardValidationResponse'
