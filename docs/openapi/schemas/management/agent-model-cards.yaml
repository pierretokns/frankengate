AgentModelCardInput:
  type: object
  additionalProperties: true
  description: Agent Model Card payload validated as a read-only admission preflight.

AgentModelCardsListResponse:
  type: object
  required: [schema_version, card_schema_version, revision, cards, total, limit, offset, has_more]
  properties:
    schema_version: { type: string }
    card_schema_version: { type: string }
    revision: { $ref: '#/AgentModelCardRevision' }
    cards: { type: array, items: { $ref: '#/AgentModelCard' } }
    total: { type: integer }
    limit: { type: integer }
    offset: { type: integer }
    has_more: { type: boolean }

AgentModelCardDetailResponse:
  type: object
  required: [schema_version, card_schema_version, revision, card]
  properties:
    schema_version: { type: string }
    card_schema_version: { type: string }
    revision: { $ref: '#/AgentModelCardRevision' }
    card: { $ref: '#/AgentModelCard' }

AgentModelCardsExportResponse:
  allOf:
    - $ref: '#/AgentModelCardsListResponse'
    - type: object
      required: [generated_at]
      properties:
        generated_at: { type: string, format: date-time }

AgentModelCardMetadataResponse:
  type: object
  required: [schema_version, card_schema_version, revision, visible_card_count, export]
  properties:
    schema_version: { type: string }
    card_schema_version: { type: string }
    revision: { $ref: '#/AgentModelCardRevision' }
    visible_card_count: { type: integer }
    export:
      type: object
      required: [path, content_type, filename]
      properties:
        path: { type: string }
        content_type: { type: string }
        filename: { type: string }

AgentModelCardVersionsResponse:
  type: object
  required: [schema_version, card_schema_version, current, history_available, versions]
  properties:
    schema_version: { type: string }
    card_schema_version: { type: string }
    current: { $ref: '#/AgentModelCardVersion' }
    history_available: { type: boolean }
    versions: { type: array, items: { $ref: '#/AgentModelCardVersion' } }
    reason_codes: { type: array, items: { type: string } }

AgentModelCardVersion:
  type: object
  required: [id, generated_at, card_count]
  properties:
    id: { type: string }
    generated_at: { type: string, format: date-time }
    card_count: { type: integer }

AgentModelCardDiffResponse:
  type: object
  required: [schema_version, card_schema_version, from_revision, to_revision, history_available, changes]
  properties:
    schema_version: { type: string }
    card_schema_version: { type: string }
    from_revision: { type: string }
    to_revision: { type: string }
    history_available: { type: boolean }
    changes: { type: array, items: { type: string } }
    reason_codes: { type: array, items: { type: string } }

AgentModelCardEvidenceResponse:
  type: object
  required: [schema_version, card_schema_version, provider, model, revision, evidence_available, health_state]
  properties:
    schema_version: { type: string }
    card_schema_version: { type: string }
    provider: { type: string }
    model: { type: string }
    revision: { $ref: '#/AgentModelCardRevision' }
    evidence_available: { type: boolean }
    evaluation_sources: { type: array, items: { type: string } }
    health_state: { type: string }
    reason_codes: { type: array, items: { type: string } }

AgentModelCardValidationResponse:
  type: object
  required: [schema_version, card_schema_version, valid]
  properties:
    schema_version: { type: string }
    card_schema_version: { type: string }
    valid: { type: boolean }
    reason_codes: { type: array, items: { type: string } }
    reasons: { type: array, items: { type: object, additionalProperties: true } }

AgentModelCardRevision:
  type: object
  required: [id, card_count]
  properties:
    id: { type: string }
    card_count: { type: integer }

AgentModelCard:
  type: object
  additionalProperties: true
  required: [provider, model, base_model, capability_state, provider_mapping]
  properties:
    provider: { type: string }
    model: { type: string }
    base_model: { type: string }
    capability_state: { type: string, enum: [known, unknown] }
    provider_mapping: { type: object, additionalProperties: true }
