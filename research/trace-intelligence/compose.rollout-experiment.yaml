services:
  postgres:
    image: postgres:16-alpine
    container_name: fg-rollout-pg
    environment:
      POSTGRES_PASSWORD: fgtest
      POSTGRES_USER: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    container_name: fg-rollout-ch
    environment:
      CLICKHOUSE_USER: fgtest
      CLICKHOUSE_PASSWORD: fgtest
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "18123:8123"
      - "19000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8123/ping | grep -q Ok"]
      interval: 2s
      timeout: 2s
      retries: 60
