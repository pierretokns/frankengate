[project]
name = "frankengate-trace-intelligence-research"
version = "0.1.0"
description = "Reproducible, governed experiments for Frankengate agent-trace intelligence"
requires-python = ">=3.9,<3.14"
dependencies = [
  "cryptography==46.0.6",
  "jsonschema==4.25.1",
  "psycopg2-binary==2.9.11",
  "pyarrow==21.0.0",
  "sentence-transformers==5.1.2",
  "sqlglot==30.13.0",
]

[tool.uv]
package = false

[dependency-groups]
test = [
  "pytest==8.4.2",
  "requests==2.32.5",
  "scikit-learn==1.6.1",
  "tomli==2.0.2",
]
