[package]
name = "frankengate-analytics-control"
version = "0.1.0"
edition = "2021"
description = "Isolated analytics control-plane contracts for FrankenGate"
license = "Apache-2.0"

[dependencies]
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros"] }
tokio = { version = "1.45", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"

[lib]
path = "src/lib.rs"

[[bin]]
name = "frankengate-analytics-control"
path = "src/main.rs"
