[package]
name = "frankengate-analytics-control"
version = "0.1.0"
edition = "2021"
description = "Isolated analytics control-plane contracts for FrankenGate"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "frankengate-analytics-control"
path = "src/main.rs"

[dependencies]
serde_json = "1.0.151"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "migrate"] }
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread", "signal", "net"] }
