{{- if .Values.analyticsControlPlane.enabled }}
{{- if and .Values.analyticsControlPlane.serviceMonitor.enabled .Values.analyticsControlPlane.databaseUrlSecret.name (not .Values.analyticsControlPlane.serviceMonitor.tenant) }}
{{- fail "analyticsControlPlane.serviceMonitor.tenant is required when analyticsControlPlane.databaseUrlSecret.name is set" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bifrost.fullname" . }}-analytics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bifrost.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-control-plane
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bifrost.fullname" . }}-analytics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bifrost.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-control-plane
spec:
  type: ClusterIP
  selector:
    {{- include "bifrost.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-control-plane
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
{{- if .Values.analyticsControlPlane.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "bifrost.fullname" . }}-analytics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bifrost.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-control-plane
    {{- with .Values.analyticsControlPlane.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "bifrost.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: analytics-control-plane
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.analyticsControlPlane.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.analyticsControlPlane.serviceMonitor.scrapeTimeout }}
      {{- with .Values.analyticsControlPlane.serviceMonitor.tenant }}
      params:
        tenant:
          - {{ . | quote }}
      {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bifrost.fullname" . }}-analytics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bifrost.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-control-plane
spec:
  replicas: {{ .Values.analyticsControlPlane.replicas }}
  selector:
    matchLabels:
      {{- include "bifrost.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: analytics-control-plane
  template:
    metadata:
      labels:
        {{- include "bifrost.labels" . | nindent 8 }}
        app.kubernetes.io/component: analytics-control-plane
    spec:
      serviceAccountName: {{ include "bifrost.fullname" . }}-analytics
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.analyticsControlPlane.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: analytics-control-plane
          image: "{{ .Values.analyticsControlPlane.image.repository }}:{{ .Values.analyticsControlPlane.image.tag }}{{- if .Values.analyticsControlPlane.image.digest }}@{{ .Values.analyticsControlPlane.image.digest }}{{- end }}"
          imagePullPolicy: {{ .Values.analyticsControlPlane.image.pullPolicy }}
          command: {{ toJson .Values.analyticsControlPlane.command }}
          {{- with .Values.analyticsControlPlane.databaseUrlSecret }}
          {{- if .name }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .name | quote }}
                  key: {{ .key | quote }}
            - name: DATABASE_MAX_CONNECTIONS
              value: {{ $.Values.analyticsControlPlane.databaseMaxConnections | quote }}
          {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.analyticsControlPlane.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.analyticsControlPlane.startupProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.analyticsControlPlane.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.analyticsControlPlane.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.analyticsControlPlane.readinessProbe.periodSeconds }}
          resources:
            {{- toYaml .Values.analyticsControlPlane.resources | nindent 12 }}
{{- if .Values.analyticsControlPlane.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "bifrost.fullname" . }}-analytics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bifrost.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-control-plane
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "bifrost.fullname" . }}-analytics
  minReplicas: {{ .Values.analyticsControlPlane.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.analyticsControlPlane.autoscaling.maxReplicas }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ .Values.analyticsControlPlane.autoscaling.behavior.scaleUp.stabilizationWindowSeconds }}
      policies:
        - type: Pods
          value: {{ .Values.analyticsControlPlane.autoscaling.behavior.scaleUp.maxReplicasPerPeriod }}
          periodSeconds: {{ .Values.analyticsControlPlane.autoscaling.behavior.scaleUp.periodSeconds }}
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.analyticsControlPlane.autoscaling.behavior.scaleDown.stabilizationWindowSeconds }}
      policies:
        - type: Pods
          value: {{ .Values.analyticsControlPlane.autoscaling.behavior.scaleDown.maxReplicasPerPeriod }}
          periodSeconds: {{ .Values.analyticsControlPlane.autoscaling.behavior.scaleDown.periodSeconds }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.analyticsControlPlane.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if .Values.analyticsControlPlane.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "bifrost.fullname" . }}-analytics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bifrost.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-control-plane
spec:
  minAvailable: {{ .Values.analyticsControlPlane.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "bifrost.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: analytics-control-plane
{{- end }}
{{- end }}
