{{- if .Values.analyticsControlPlane.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bifrost.fullname" . }}-analytics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bifrost.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-control-plane
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bifrost.fullname" . }}-analytics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bifrost.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-control-plane
spec:
  type: ClusterIP
  selector:
    {{- include "bifrost.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-control-plane
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bifrost.fullname" . }}-analytics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bifrost.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-control-plane
spec:
  replicas: {{ .Values.analyticsControlPlane.replicas }}
  selector:
    matchLabels:
      {{- include "bifrost.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: analytics-control-plane
  template:
    metadata:
      labels:
        {{- include "bifrost.labels" . | nindent 8 }}
        app.kubernetes.io/component: analytics-control-plane
    spec:
      serviceAccountName: {{ include "bifrost.fullname" . }}-analytics
      containers:
        - name: analytics-control-plane
          image: "{{ .Values.analyticsControlPlane.image.repository }}:{{ .Values.analyticsControlPlane.image.tag }}"
          imagePullPolicy: {{ .Values.analyticsControlPlane.image.pullPolicy }}
          command: {{ toJson .Values.analyticsControlPlane.command }}
          {{- if .Values.analyticsControlPlane.databaseUrl.existingSecret }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.analyticsControlPlane.databaseUrl.existingSecret | quote }}
                  key: {{ .Values.analyticsControlPlane.databaseUrl.existingSecretKey | quote }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.analyticsControlPlane.resources | nindent 12 }}
{{- if .Values.analyticsControlPlane.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "bifrost.fullname" . }}-analytics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bifrost.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-control-plane
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "bifrost.fullname" . }}-analytics
  minReplicas: {{ .Values.analyticsControlPlane.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.analyticsControlPlane.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.analyticsControlPlane.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
